# Monitor setup (auto-detect resolution/position/refresh rate/scale)
monitor=,preferred,auto,1

# Startup applications
exec-once = waybar
exec-once = hyprpaper

# Input devices
input {
    kb_layout = de
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

# General window behavior
general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = true
}

dwindle {
    preserve_split = true
}

source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf
